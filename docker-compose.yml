version: '3.8'

services:
    postgres_db:
      image: postgres:13
      environment:
        - POSTGRES_USER=airflow
        - POSTGRES_PASSWORD=airflow
        - POSTGRES_DB=airflow
      volumes:
        - postgresdb:/var/lib/postgresql/data

    redis:
      image: redis:latest
      ports:
        - "6379:6379"

    airflow-webserver:
      image: apache/airflow:2.4.1
      depends_on:
        - postgres_db
        - redis
      environment:
        - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_db/airflow
        - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
        - AIRFLOW__WEBSERVER__EXPOSE_HOST_ALL=False
      ports:
        - "8080:8080"
      volumes:
        - ./dags:/opt/airflow/dags
        - ./plugins:/opt/airflow/plugins
      command: webserver

    airflow-scheduler:
      image: apache/airflow:2.4.1
      depends_on:
        - postgres_db
        - redis
      environment:
        - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_db/airflow
        - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
      volumes:
        - ./dags:/opt/airflow/dags
        - ./plugins:/opt/airflow/plugins
      command: scheduler

    airflow-worker:
      image: apache/airflow:2.4.1
      depends_on:
        - postgres_db
        - redis
      environment:
        - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_db/airflow
        - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
      volumes:
        - ./dags:/opt/airflow/dags
        - ./plugins:/opt/airflow/plugins
      command: celery worker

volumes:
  postgresdb: